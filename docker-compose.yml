services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bot-adapter-postgres
    restart: unless-stopped
    ports:
      # Host port 5433, not 5432 — avoids clashing with any Postgres already
      # running natively on the host (e.g. a Homebrew-installed instance
      # bound to 127.0.0.1:5432, which macOS prefers over Docker's port
      # mapping for connections from non-containerized processes).
      - '5433:5432'
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bot_adapter
    volumes:
      - bot-adapter-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d bot_adapter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bot-adapter-postgres-data:
